name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-safe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test tools
        run: >-
          python -m pip install
          pytest==9.0.2
          pytest-mock==3.15.1
          pytest-asyncio==1.3.0
          pytest-timeout==2.4.0
          lazy-loader==0.4.0
          pydantic==2.11.7
          rich
          requests==2.32.5
          ruff
          uv==0.9.11

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Build package
        run: uv build --out-dir dist

      - name: Run CPU-safe tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" tests

      - name: Check fatal Ruff rules
        run: ruff check --select E9,F63,F7,F82 src scripts tests
